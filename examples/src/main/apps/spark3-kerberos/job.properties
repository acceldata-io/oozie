nameNode=hdfs://localhost:8020
resourceManager=localhost:8032

oozie.use.system.libpath=true
# Route to the spark3 sharelib instead of the default spark (2.x) sharelib
oozie.action.sharelib.for.spark=spark3
oozie.wf.application.path=${nameNode}/user/${user.name}/examples/apps/spark3-kerberos

# --- Spark job ---
sparkJobName=Oozie_Spark3_Kerberos_Job
sparkClass=org.apache.spark.examples.SparkPi
sparkJar=${nameNode}/user/${user.name}/examples/apps/spark3/lib/spark-examples_2.12-3.5.5.jar

# --- Resource tuning ---
executorMemory=2g
driverMemory=1g
executorCores=1

# --- Kerberos ---
# Principal of the headless service account used to run the job
kerberosPrincipal=spark-user@REALM.COM
# Full HDFS path to the keytab file (must be readable by the oozie user)
kerberosKeytabHdfsPath=${nameNode}/user/oozie/security/spark-user.headless.keytab
# Local alias under which the keytab is staged into the launcher container.
# Use the same value in --keytab inside spark-opts.
kerberosKeytabAlias=spark-user.headless.keytab
